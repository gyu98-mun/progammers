<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이미지 슬라이더</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      padding: 20px;
    }

    .carousel-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      margin: 50px auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .carousel {
      display: flex;
      overflow-x: scroll;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .carousel::-webkit-scrollbar {
      display: none;
    }

    .carousel-item {
      flex: 0 0 100%;
      scroll-snap-align: start;
    }

    .carousel-item img {
      width: 100%;
      height: 500px;
      object-fit: cover;
      display: block;
    }

    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.5);
      color: white;
      border: none;
      font-size: 2rem;
      padding: 15px 20px;
      cursor: pointer;
      z-index: 10;
      border-radius: 5px;
      transition: background 0.3s;
    }

    .carousel-btn:hover {
      background: rgba(0, 0, 0, 0.8);
    }

    .carousel-btn:active {
      transform: translateY(-50%) scale(0.95);
    }

    .prev {
      left: 20px;
    }

    .next {
      right: 20px;
    }

    .carousel-dots {
      text-align: center;
      padding: 20px 0;
      background: white;
    }

    .dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ddd;
      margin: 0 6px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .dot:hover {
      background: #999;
    }

    .dot.active {
      background: #333;
      transform: scale(1.2);
    }

    /* 반응형 디자인 */
    @media (max-width: 768px) {
      .carousel-item img {
        height: 300px;
      }

      .carousel-btn {
        font-size: 1.5rem;
        padding: 10px 15px;
      }

      .prev {
        left: 10px;
      }

      .next {
        right: 10px;
      }
    }
  </style>
</head>
<body>

  <div class="carousel-container">
    <button class="carousel-btn prev" onclick="scrollCarousel(-1)">‹</button>
    
    <div class="carousel" id="carousel">
      <div class="carousel-item">
        <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800" alt="Mountain 1">
      </div>
      <div class="carousel-item">
        <img src="https://images.unsplash.com/photo-1511593358241-7eea1f3c84e5?w=800" alt="Mountain 2">
      </div>
      <div class="carousel-item">
        <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=800" alt="Nature 1">
      </div>
      <div class="carousel-item">
        <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=800" alt="Nature 2">
      </div>
      <div class="carousel-item">
        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800" alt="Forest">
      </div>
    </div>
    
    <button class="carousel-btn next" onclick="scrollCarousel(1)">›</button>

    <div class="carousel-dots" id="dots">
      <span class="dot active" data-index="0"></span>
      <span class="dot" data-index="1"></span>
      <span class="dot" data-index="2"></span>
      <span class="dot" data-index="3"></span>
      <span class="dot" data-index="4"></span>
    </div>
  </div>

  <script>
    const carousel = document.getElementById('carousel');
    const dots = document.querySelectorAll('.dot');
    let isScrolling = false;

    // 버튼 클릭으로 슬라이드 이동
    function scrollCarousel(direction) {
      const scrollAmount = carousel.offsetWidth;
      carousel.scrollBy({
        left: scrollAmount * direction,
        behavior: 'smooth'
      });
    }

    // 스크롤 시 활성 dot 업데이트
    carousel.addEventListener('scroll', () => {
      if (!isScrolling) {
        window.requestAnimationFrame(() => {
          const index = Math.round(carousel.scrollLeft / carousel.offsetWidth);
          updateActiveDot(index);
          isScrolling = false;
        });
        isScrolling = true;
      }
    });

    // dot 클릭 시 해당 슬라이드로 이동
    dots.forEach((dot) => {
      dot.addEventListener('click', () => {
        const index = parseInt(dot.getAttribute('data-index'));
        carousel.scrollTo({
          left: carousel.offsetWidth * index,
          behavior: 'smooth'
        });
        updateActiveDot(index);
      });
    });

    // 활성 dot 업데이트 함수
    function updateActiveDot(index) {
      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === index);
      });
    }

    // 키보드 네비게이션 (선택사항)
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') {
        scrollCarousel(-1);
      } else if (e.key === 'ArrowRight') {
        scrollCarousel(1);
      }
    });

    // 자동 슬라이드 (선택사항 - 주석 해제하여 사용)
    /*
    let autoSlideInterval = setInterval(() => {
      const currentIndex = Math.round(carousel.scrollLeft / carousel.offsetWidth);
      const nextIndex = (currentIndex + 1) % dots.length;
      carousel.scrollTo({
        left: carousel.offsetWidth * nextIndex,
        behavior: 'smooth'
      });
    }, 3000); // 3초마다 자동 슬라이드

    // 마우스 호버 시 자동 슬라이드 멈춤
    carousel.addEventListener('mouseenter', () => {
      clearInterval(autoSlideInterval);
    });

    carousel.addEventListener('mouseleave', () => {
      autoSlideInterval = setInterval(() => {
        const currentIndex = Math.round(carousel.scrollLeft / carousel.offsetWidth);
        const nextIndex = (currentIndex + 1) % dots.length;
        carousel.scrollTo({
          left: carousel.offsetWidth * nextIndex,
          behavior: 'smooth'
        });
      }, 3000);
    });
    */
  </script>

</body>
</html>
