<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Floating Image Ad (Top Right)</title>

<style>
  body {
    margin: 0;
    height: 200vh;
  }

  /* 플로팅 광고 버튼 */
  #floatingAd {
    position: fixed;
    right: 20px;
    top: 150px;
    width: 150px;
    height: 150px;
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
    z-index: 1000;
    background: #eee;
    box-shadow:
      0 6px 18px rgba(0,0,0,0.35);
  }

  #floatingAd img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: opacity 0.6s ease;
  }

  /* 광고 배지 */
  #badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(0,0,0,0.65);
    color: #fff;
    font-size: 11px;
    padding: 3px 7px;
    border-radius: 10px;
    font-weight: bold;
  }
</style>
</head>
<body>

<!-- 플로팅 광고 버튼 -->
<div id="floatingAd">
  <span id="badge">AD</span>
  <img id="adImg">
</div>

<script>
  const ads = [
  {
    img: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600",
    link: "https://example.com/travel"
  },
  {
    img: "https://images.unsplash.com/photo-1566073771259-6a8506099945?w=600",
    link: "https://example.com/hotel"
  },
  {
    img: "https://images.unsplash.com/photo-1528605248644-14dd04022da1?w=600",
    link: "https://example.com/food"
  },
  {
    img: "https://images.unsplash.com/photo-1436491865332-7a61a109cc05?w=600",
    link: "https://example.com/flight"
  }
];

  let index = 0;
  const adImg = document.getElementById("adImg");
  const floatingAd = document.getElementById("floatingAd");

  function showAd() {
    adImg.style.opacity = 0;
    setTimeout(() => {
      adImg.src = ads[index].img;
      adImg.style.opacity = 1;
    }, 200);
  }

  function nextAd() {
    index = (index + 1) % ads.length;
    showAd();
  }

  floatingAd.onclick = () => {
    window.open(ads[index].link, "_blank");
  };

  showAd();
  setInterval(nextAd, 3000);
</script>

</body>
</html>
