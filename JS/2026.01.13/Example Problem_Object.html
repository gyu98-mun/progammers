<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        var Scores = [80, 60, 70, 50, 40, 100];
        document.write("Scores: " + Scores, "<br>");       

        var totalScore = 0;
        for (var i = 0; i < Scores.length; i++) {
            totalScore += Scores[i];
        }
        document.write("Total Score: " + totalScore, "<br>");

        var averageScore = totalScore / Scores.length;
        document.write("Average Score: " + averageScore, "<br>");
    </script>
</head>
<body>  
    
</body>
</html>
