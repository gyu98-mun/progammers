<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        var today = new Date();
        var nowMonth = today.getMonth(), nowDate = today.getDate(), nowDay = today.getDay();
        var day = ["일", "월", "화", "수", "목", "금", "토"];
        document.write("<h1>오늘 날짜 정보</h1>")
        document.write("현재 월: " + (nowMonth + 1), "<br>")
        document.write("현재 일: " + nowDate, "<br>")
        document.write("현재 요일: " + day[nowDay] + "요일", "<br>")

        var worldcup = new Date(2002, 4, 31);
        var wcMonth = worldcup.getMonth(), wcDate = worldcup.getDate(), wcDay = worldcup.getDay();
        document.write("<h1>2002년 월드컵 날짜 정보</h1>")
        document.write("월드컵 월: " + (wcMonth + 1), "<br>")
        document.write("월드컵 일: " + wcDate, "<br>")
        document.write("월드컵 요일: " + day[wcDay] + "요일", "<br>")

        var nowYear = today.getFullYear();
        var theDate = new Date(nowYear, 11, 31);
        var diffDate = theDate.getTime() - today.getTime();
        var result = Math.ceil(diffDate / (1000 * 60 * 60 * 24));
        document.write("<h1>오늘부터 올해 남은 날짜</h1>")
        document.write("남은 날짜: " + result + "일", "<br>")
    </script>
</head>
<body>
    
</body>
</html>
